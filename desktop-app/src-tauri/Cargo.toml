[package]
name = "apisaverwriter"
version = "0.1.0"
description = "AI Novel Writing Assistant - 用最少的API写出最火的小说"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

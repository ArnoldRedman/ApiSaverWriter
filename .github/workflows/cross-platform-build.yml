name: ApiSaverWriter Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, runner: windows-latest, kind: windows }
          - { label: macos-apple-silicon, runner: macos-latest, kind: macos-arm }
          - { label: macos-intel, runner: macos-15-intel, kind: macos-intel }
          - { label: android, runner: ubuntu-latest, kind: android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android Rust targets
        if: matrix.kind == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: actions/setup-java@v4
        if: matrix.kind == 'android'
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        if: matrix.kind == 'android'
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Build Windows
        if: matrix.kind == 'windows'
        run: npm run tauri:build --prefix desktop-app
      - name: Package Windows assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem desktop-app/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe | ForEach-Object { Copy-Item $_.FullName release-assets/ -Force }
      - name: Build macOS Apple Silicon
        if: matrix.kind == 'macos-arm'
        run: npm run tauri:build --prefix desktop-app -- --target aarch64-apple-darwin
      - name: Build macOS Intel
        if: matrix.kind == 'macos-intel'
        run: npm run tauri:build --prefix desktop-app -- --target x86_64-apple-darwin
      - name: Package macOS assets
        if: startsWith(matrix.kind, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          arch="AppleSilicon"
          [ "${{ matrix.kind }}" = "macos-intel" ] && arch="Intel"
          dmg="$(find desktop-app/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "release-assets/ApiSaverWriter_${{ github.ref_name }}_macOS_${arch}.dmg"
          app="$(find desktop-app/src-tauri/target -path '*/release/bundle/macos/*.app' -print -quit)"
          test -n "$app"
          tar -C "$(dirname "$app")" -czf "release-assets/ApiSaverWriter_${{ github.ref_name }}_macOS_${arch}.app.tar.gz" "$(basename "$app")"
      - name: Prepare Android SDK
        if: matrix.kind == 'android'
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build Android
        if: matrix.kind == 'android'
        run: |
          npx tauri android init --ci
          npm run android:build --prefix desktop-app
      - name: Package Android assets
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop-app/src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} release-assets/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
